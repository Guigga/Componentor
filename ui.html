<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Componentor</title>
  <style>
    :root { --bg:#fff; --txt:#222; --muted:#727272; --primary:#4894C4; --border:#d9d9d9; }
    *{ box-sizing: border-box; }
    body{ margin:0; font-family: Inter, ui-sans-serif, system-ui; background:var(--bg); color:var(--txt); }
    .wrapper{ width:100%; height:100vh; padding:16px; display: flex; flex-direction: column; }
    .label{ font-weight:600; margin:4px 0 8px; font-size: 13px; }
    .input, textarea{ width:100%; padding:10px 14px; border:1px solid var(--border); border-radius:10px; outline:none; font-size:14px; font-family: inherit; }
    textarea { resize: vertical; }
    .row{ display:flex; align-items:center; gap:10px; margin-top:8px; margin-bottom: 20px; }
    .toggle{ width:40px; height:24px; border-radius:999px; background:#e9e9e9; position:relative; cursor:pointer; flex:0 0 auto;  }
    .toggle[data-on="true"]{ background:#d6eefb; }
    .toggle .knob{ width:18px; height:18px; border-radius:50%; background:#fff; position:absolute; top:3px; left:3px; transition:all .16s ease; box-shadow:0 1px 2px rgba(0,0,0,.15); }
    .toggle[data-on="true"] .knob{ left:19px; }
    .muted{ color:var(--muted); font-size:13px; }
    .chip{ padding:6px 8px; border:1px solid var(--border); border-radius:8px; font-size:12px; color:#555; }
    .stack{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    #docs-fields {
        display: none;
        margin-top: -10px;
        margin-bottom: 20px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
    }

    /* --- ESTILOS DO RODAPÉ --- */
    .footer {
      margin-top: auto; /* Empurra todo o rodapé para baixo */
    }
    .hint {
      font-size: 12px;
      color: var(--muted);
      padding-top: 8px;
      line-height: 1.3;
    }
    .watermark {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding-top: 12px;
      opacity: 0.9;
    }
    /* Estilo para o link da marca d'água */
    .watermark a {
      color: inherit; /* Herda a cor cinza do pai */
      text-decoration: none; /* Remove o sublinhado padrão */
    }
    .watermark a:hover {
      text-decoration: underline; /* Adiciona sublinhado ao passar o mouse */
    }
    /* -------------------------- */

    /* --- ESTILOS DOS BOTÕES --- */
    .btn{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 52px;
      margin-top: 8px;
      padding: 0 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600; /* Semi Bold */
      cursor: pointer;
      flex-shrink: 0; 
      
      background: var(--primary);
      color: #fff;
      border: none;
    }
    .btn.secondary{
      background: var(--bg);
      color: var(--primary);
      border: 2px solid var(--primary);
      height: 51px;
    }
    .btn:disabled{
      opacity: .5;
      cursor: not-allowed;
    }
    .btn svg, .btn span {
      display: block; 
    }
    .btn svg {
      flex-shrink: 0; 
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="label">Component Name</div>
    <input id="obj-name" class="input" placeholder="E.g., Button, Input Field" />

    <div class="row" style="margin-bottom: 0px;"> 
      <div id="use-layer-name" class="toggle" data-on="false"><div class="knob"></div></div>
      <div class="muted">Use layer name for variants</div>
    </div>

    <div class="row" style="margin-bottom: 24px;">
        <div id="make-box" class="toggle" data-on="false"><div class="knob"></div></div>
        <div class="muted">Generate documentation</div>
    </div>
    
    <div id="docs-fields">
        <div class="label" style="margin-top:0;">Description</div>
        <textarea id="doc-description" class="input" rows="2" placeholder="What is this component for?"></textarea>

        <div class="label" style="margin-top:12px;">Location</div>
        <textarea id="doc-location" class="input" rows="2" placeholder="Where should this be used?"></textarea>
        
        <div class="label" style="margin-top:12px;">Behavior</div>
        <textarea id="doc-behavior" class="input" rows="2" placeholder="How does it interact?"></textarea>
    </div>

      <span>Create Component Set</span>
    </button>
    <button id="btn-create-master" class="btn secondary">
      <svg width="19" height="19" viewBox="0 0 19 19" fill="none" xmlns="http://www.w3.org/2000/svg">

      </svg>
      <span>Create Master Component</span>
    </button>
    
    <div class="stack" id="sel-info" style="margin-top:10px;"></div>
    
    <div class="footer">
      <div class="hint">Select 2+ objects to create variants. The plugin maintains position when replacing instances.</div>
      <div class="watermark">
        <a href="https://www.guigga.com.br" target="_blank">Created by Guigga</a>
      </div>
    </div>
  </div>

  <script>
    const $ = (q)=>document.querySelector(q);

    // Lógica para os Toggles
    document.querySelectorAll('.toggle').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const on = toggle.getAttribute('data-on') === 'true' ? 'false' : 'true';
        toggle.setAttribute('data-on', on);
      });
    });

    // Lógica específica para o toggle de documentação
    const makeBoxToggle = $('#make-box');
    const docsFields = $('#docs-fields');
    makeBoxToggle.addEventListener('click', () => {
        const on = makeBoxToggle.getAttribute('data-on') === 'true'; // já foi invertido pelo listener acima
        docsFields.style.display = on ? 'block' : 'none';
        // Redimensiona a janela do plugin para acomodar os novos campos
        parent.postMessage({ pluginMessage: { type: 'resize', height: on ? 640 : 440 }}, '*');
    });

    const getPluginMessage = (type) => ({
      pluginMessage:{
        type,
        name: $('#obj-name').value.trim(),
        useLayerName: $('#use-layer-name').getAttribute('data-on') === 'true',
        makeBox: $('#make-box').getAttribute('data-on') === 'true',
        description: $('#doc-description').value.trim(),
        location: $('#doc-location').value.trim(),
        behavior: $('#doc-behavior').value.trim()
      }
    });

    const btnSet = $('#btn-create-set');
    const btnMaster = $('#btn-create-master');
    const btnSetLabel = btnSet.querySelector('span');
    const btnMasterLabel = btnMaster.querySelector('span');

    let selectionCount = 0;
    let busy = false;

    // Botões refletem o estado: desabilitados sem seleção suficiente,
    // e travados em "Generating…" enquanto o plugin processa (evita
    // cliques repetidos que empilhavam execuções).
    function refreshButtons(){
      btnSet.disabled = busy || selectionCount < 2;
      btnMaster.disabled = busy || selectionCount < 1;
      btnSetLabel.innerText = busy ? 'Generating…' : 'Create Component Set';
      btnMasterLabel.innerText = busy ? 'Generating…' : 'Create Master Component';
    }
    refreshButtons();

    function send(type){
      if (busy) return;
      busy = true;
      refreshButtons();
      parent.postMessage(getPluginMessage(type), '*');
    }

    btnSet.onclick = ()=> send('create-component-set');
    btnMaster.onclick = ()=> send('create-master-component');

    onmessage = (event)=>{
      const msg = event.data.pluginMessage;
      if(!msg) return;
      if(msg.type==='selection-info'){
        selectionCount = msg.count;
        const info = $('#sel-info');
        info.innerHTML = '';
        const hint = msg.count < 2 ? `${msg.count} selected — select 2+ for variants` : `${msg.count} selected`;
        info.append(Object.assign(document.createElement('span'),{className:'chip', innerText: hint}));
        // Sugere o nome do primeiro objeto selecionado como nome do componente
        if (msg.firstName) $('#obj-name').placeholder = msg.firstName;
        refreshButtons();
      }
      if(msg.type==='done'){
        busy = false;
        refreshButtons();
      }
    };
  </script>
</body>
</html>
