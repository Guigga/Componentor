<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visualizador de Layout</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 16px;
      background-color: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 14px;
      text-align: center;
    }
    p {
      font-size: 12px;
      color: #555;
      text-align: center;
      margin-bottom: 16px;
    }
    button {
      background-color: #7B61FF;
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      width: 100%;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #6a52e0;
    }
    button:active {
      background-color: #5844c3;
    }
  </style>
</head>
<body>

  <h2>Visualizador de Layout</h2>
  <p>Selecione um <b>Frame com Auto Layout</b> para gerar uma cópia com a visualização do seu <b>padding</b> e <b>espaçamento (Gap)</b>.</p>
  <button id="visualize-button">Criar Visualização de Layout</button>

  <script>
    document.getElementById('visualize-button').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'visualize-layout' } }, '*');
    }
  </script>

</body>
</html>
