<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SVG → Ready for CSS</title>
  <style>
    :root { --pad: 12px; }
    * { box-sizing: border-box; }
    body { font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; margin: 0; }
    header { padding: var(--pad); border-bottom: 1px solid #e5e5e5; }
    main { padding: var(--pad); display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; align-items: center; }
    button { padding: 6px 10px; border: 1px solid #d0d0d0; background: #fff; border-radius: 6px; cursor: pointer; }
    button:active { transform: translateY(1px); }
    textarea { width: 100%; height: 120px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; padding: 8px; }
    label { font-size: 12px; color: #444; }
    input[type="number"] { width: 90px; padding: 6px; }
    .preview-wrap { border: 1px dashed #ccc; border-radius: 8px; padding: 8px; }
    .preview-title { font-size: 12px; color: #666; margin: 0 0 6px; }
    #preview {
      width: 150px; height: 150px;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      border-radius: 6px;
      border: 1px solid #eee;
    }
    .tips { font-size: 11px; color: #666; }
  </style>
</head>
<body>
  <header>
    <strong>SVG → Ready for CSS</strong>
  </header>

  <main>
    <div class="row">
      <button id="convert">Converter seleção</button>
      <button id="copy">Copiar CSS</button>
    </div>

    <div class="row" style="gap:16px; align-items: flex-start;">
      <div class="preview-wrap">
        <p class="preview-title">Preview (background-image)</p>
        <div id="preview"></div>
      </div>

      <div style="flex:1;">
        <label for="css">CSS gerado</label>
        <textarea id="css" readonly></textarea>
        <p class="tips">Dica: você pode aplicar também
          <code>background-size: contain;</code>,
          <code>background-repeat: no-repeat;</code>,
          <code>background-position: center;</code>.
        </p>
      </div>
    </div>

    <div class="row">
      <label for="w">Largura preview (px)</label>
      <input id="w" type="number" min="1" value="150" />
      <label for="h">Altura preview (px)</label>
      <input id="h" type="number" min="1" value="150" />
      <button id="applySize">Aplicar tamanho</button>
    </div>
  </main>

  <script>
    const btnConvert = document.getElementById('convert');
    const btnCopy = document.getElementById('copy');
    const btnApplySize = document.getElementById('applySize');
    const txt = document.getElementById('css');
    const preview = document.getElementById('preview');
    const w = document.getElementById('w');
    const h = document.getElementById('h');

    btnConvert.onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'convert' } }, '*');
    };

    btnCopy.onclick = async () => {
      try {
        await navigator.clipboard.writeText(txt.value);
      } catch (e) {
        // fallback
        txt.select();
        document.execCommand('copy');
      }
    };

    btnApplySize.onclick = () => {
      const W = Math.max(1, parseInt(w.value || '150', 10));
      const H = Math.max(1, parseInt(h.value || '150', 10));
      preview.style.width = W + 'px';
      preview.style.height = H + 'px';
    };

    onmessage = (event) => {
      const msg = event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === 'result') {
        // Atualiza textarea e preview
        txt.value = msg.css;
        if (msg.previewUrl) {
          preview.style.backgroundImage = `url("${msg.previewUrl}")`;
        } else {
          preview.style.backgroundImage = 'none';
        }
        if (msg.width && msg.height) {
          w.value = String(msg.width);
          h.value = String(msg.height);
          preview.style.width = msg.width + 'px';
          preview.style.height = msg.height + 'px';
        }
      } else if (msg.type === 'notify') {
        // opcional: mensagens de status
        console.log(msg.message);
      }
    };
  </script>
</body>
</html>
